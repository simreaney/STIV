# XcodeGen fallback.
#
# `ios/StivApp.xcodeproj` is checked in and should just open in Xcode 16 or
# later. It was hand-authored, though, so if it refuses to open or the
# synchronized folder does not pick up the sources, regenerate an equivalent
# project from this file instead:
#
#     brew install xcodegen
#     cd ios && xcodegen generate --spec project.yml --project .
#
# Note that XcodeGen writes explicit per-file entries rather than a
# synchronized folder, so a project generated from here needs regenerating
# whenever a source file is added.

name: StivApp
options:
  bundleIdPrefix: org.stiv
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  StivKit:
    path: StivKit

targets:
  STIV:
    type: application
    platform: iOS
    sources:
      - path: StivApp
        excludes:
          - Info.plist
    dependencies:
      - package: StivKit
        product: StivKit
    scheme:
      testTargets:
        - StivAppTests
    # No `info:` key: XcodeGen would regenerate Info.plist from it and wipe the
    # camera usage string, the arkit capability, the launch screen and the
    # orientations.  INFOPLIST_FILE below uses the checked-in file as it is.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.stiv.app
        PRODUCT_NAME: STIV
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: StivApp/Info.plist
        # Info.plist reads its version and build from these.
        MARKETING_VERSION: "1.1.1"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"
        # StivApp/Assets.xcassets: the icon, the tint, and the launch colour
        # Info.plist's UILaunchScreen names.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

  # App-hosted unit tests: they run inside STIV.app in the simulator (or on a
  # phone), so they can reach the AR adapters with `@testable import STIV`.
  # XcodeGen sets TEST_HOST and BUNDLE_LOADER from the dependency.
  StivAppTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: StivAppTests
    dependencies:
      - target: STIV
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.stiv.app.tests
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"
