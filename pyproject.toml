[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stiv"
dynamic = ["version"]          # from stiv.__version__
description = "Space-Time Image Velocimetry for river surface flow from drone video"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["hydrology", "river", "velocimetry", "STIV", "discharge", "UAV", "drone"]
classifiers = [
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Hydrology",
    "Programming Language :: Python :: 3",
]

dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "opencv-python-headless>=4.7",   # no cv2 GUI calls; the picker uses matplotlib
    "matplotlib>=3.7",
    "pandas>=2.0",
    "PyYAML>=6.0",
    "tqdm>=4.65",
]

[project.optional-dependencies]
test = ["pytest>=7.0"]
gui = ["PyQt5>=5.15"]          # only needed for the interactive `stiv pick`
widgets = [                    # the interactive survey wizard (stiv.notebook_ui), for
    "ipywidgets>=7.6",         # a kernel that already has Jupyter: Colab, JupyterHub,
    "ipympl>=0.9",             # VS Code. 7.6 rather than 8, so installing it never
    "ipyfilechooser>=0.6",     # replaces the widgets a hosted frontend was built for.
]
notebook = [                   # the wizard plus JupyterLab 4 to run it in
    "stiv[widgets]",
    "ipywidgets>=8",
    "jupyterlab>=4",
    "ipykernel>=6",
]

[project.scripts]
stiv = "stiv.cli:main"

[tool.setuptools]
packages = ["stiv"]

[tool.setuptools.dynamic]
version = { attr = "stiv.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
