name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Notebooks are stripped
        run: python tools/strip_notebooks.py --check
      - name: Install
        # The notebook extra too, or the wizard's tests skip themselves.
        run: python -m pip install -e '.[test,notebook]'
      - name: Test
        run: python -m pytest -q

  stivkit:
    name: StivKit (Swift)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Test
        working-directory: ios/StivKit
        run: swift test
